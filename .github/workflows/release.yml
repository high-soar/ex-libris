name: Release

on:
  push:
    branches: [main]
    paths:
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Git Tag & Signed APK GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Verify release runs on main branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Release workflow must run on refs/heads/main (actual: ${GITHUB_REF})."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Extract version metadata from package.json
        id: meta
        run: |
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const version = String(pkg.version || "").trim();
            const match = version.match(/^(\d+)\.(\d+)\.(\d+)$/);
            if (!match) {
              console.error("Invalid SemVer version in package.json:", version);
              process.exit(1);
            }
            const [, major, minor, patch] = match;
            const majorMinor = `${major}.${minor}`;
            const reportsDir = path.resolve("docs/quality/reports");
            const reportPattern = new RegExp(`^v${major}\\.${minor}-.*\\.md$`);
            const reportFile = fs.existsSync(reportsDir)
              ? fs.readdirSync(reportsDir).sort().find((f) => reportPattern.test(f)) || ""
              : "";
            const reportPath = reportFile ? `docs/quality/reports/${reportFile}` : "";
            const out = [
              `version=${version}`,
              `tag=v${version}`,
              `major_minor=${majorMinor}`,
              `patch=${patch}`,
              `report_path=${reportPath}`,
            ].join("\n") + "\n";
            fs.appendFileSync(process.env.GITHUB_OUTPUT, out);
          '

      - name: Check existing tag and release
        id: check_existing
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [ "${TAG}" = "v0.0.0" ]; then
            echo "Initial bootstrap version v0.0.0 detected. Skipping release creation."
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          elif git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1 || gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Tag or Release ${TAG} already exists. Skipping release creation."
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Tag and Release ${TAG} do not exist yet."
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate Android Signing Secrets
        if: steps.check_existing.outputs.exists == 'false'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          node -e '
            const required = [
              "ANDROID_KEYSTORE_BASE64",
              "ANDROID_KEYSTORE_PASSWORD",
              "ANDROID_KEY_ALIAS",
              "ANDROID_KEY_PASSWORD",
            ];
            for (const name of required) {
              if (String(process.env[name] || "").trim().length === 0) {
                console.error(`Missing or empty required signing secret: ${name}`);
                process.exit(1);
              }
            }
            const cleanedBase64 = String(process.env.ANDROID_KEYSTORE_BASE64 || "").replace(/\s+/g, "");
            if (!/^[A-Za-z0-9+/]+={0,2}$/.test(cleanedBase64) || cleanedBase64.length % 4 !== 0) {
              console.error("ANDROID_KEYSTORE_BASE64 is not a valid Base64 string.");
              process.exit(1);
            }
            const decoded = Buffer.from(cleanedBase64, "base64");
            if (decoded.length === 0 || decoded.toString("base64") !== cleanedBase64) {
              console.error("ANDROID_KEYSTORE_BASE64 failed strict Base64 validation or decoded to 0 bytes.");
              process.exit(1);
            }
            console.log("All 4 Android signing secrets validated.");
          '

      - name: Compute Monotonic versionCode
        id: version
        if: steps.check_existing.outputs.exists == 'false'
        run: |
          node -e '
            const fs = require("node:fs");
            const versionCode = Math.floor(Date.now() / 1000) - 1_700_000_000;
            if (!Number.isInteger(versionCode) || versionCode < 1 || versionCode > 2_100_000_000) {
              console.error(`Computed versionCode out of bounds [1, 2_100_000_000]: ${versionCode}`);
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `version_code=${versionCode}\n`);
            console.log(`Computed versionCode=${versionCode}`);
          '

      - name: Setup Java
        if: steps.check_existing.outputs.exists == 'false'
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Build Web Assets and Sync Capacitor Android
        if: steps.check_existing.outputs.exists == 'false'
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Setup Gradle
        if: steps.check_existing.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
          gradle-home-cache-strict-match: true

      - name: Build Signed Release APK
        if: steps.check_existing.outputs.exists == 'false'
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.version_code }}
          REQUIRE_FIXED_SIGNING: "true"
          TAG: ${{ steps.meta.outputs.tag }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          (cd android && ./gradlew assembleRelease)
          cp android/app/build/outputs/apk/release/app-release.apk "ex-libris-${TAG}.apk"

      - name: Verify APK Signature & Write Step Summary
        if: steps.check_existing.outputs.exists == 'false'
        env:
          APK_PATH: ex-libris-${{ steps.meta.outputs.tag }}.apk
          VERSION_NAME: ${{ steps.meta.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          if [ ! -f "${APK_PATH}" ]; then
            echo "::error::Expected APK not found at ${APK_PATH}"
            exit 1
          fi

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER_BIN=""
          if [ -n "${SDK_ROOT}" ] && [ -d "${SDK_ROOT}/build-tools" ]; then
            for ver in $(ls -1 "${SDK_ROOT}/build-tools" | sort -Vr); do
              if [ -x "${SDK_ROOT}/build-tools/${ver}/apksigner" ]; then
                APKSIGNER_BIN="${SDK_ROOT}/build-tools/${ver}/apksigner"
                break
              fi
            done
          fi

          if [ -n "${APKSIGNER_BIN}" ]; then
            echo "Verifying APK signature with apksigner: ${APKSIGNER_BIN}"
            if ! CERT_OUTPUT="$("${APKSIGNER_BIN}" verify --print-certs "${APK_PATH}")"; then
              echo "::error::apksigner verify --print-certs failed for ${APK_PATH}"
              exit 1
            fi
            VERIFY_TOOL="apksigner"
          else
            echo "apksigner binary not found under build-tools; falling back to keytool -printcert -jarfile"
            if ! CERT_OUTPUT="$(keytool -printcert -jarfile "${APK_PATH}")"; then
              echo "::error::keytool -printcert -jarfile failed for ${APK_PATH}"
              exit 1
            fi
            VERIFY_TOOL="keytool"
          fi

          CERT_OUTPUT="${CERT_OUTPUT}" VERIFY_TOOL="${VERIFY_TOOL}" node -e '
            const fs = require("node:fs");
            const output = String(process.env.CERT_OUTPUT || "");
            const normalizeHex = (raw, expectedLen) => {
              const hex = String(raw || "").replace(/[^0-9a-fA-F]/g, "").toUpperCase();
              if (hex.length !== expectedLen) return "";
              return hex.match(/.{2}/g).join(":");
            };
            const sha1Match = output.match(/SHA-?1(?:\s+digest)?:\s*([0-9a-fA-F:]+)/i);
            const sha256Match = output.match(/SHA-?256(?:\s+digest)?:\s*([0-9a-fA-F:]+)/i);
            const sha1 = normalizeHex(sha1Match ? sha1Match[1] : "", 40);
            const sha256 = normalizeHex(sha256Match ? sha256Match[1] : "", 64);
            if (!sha1 || !sha256) {
              console.error("Failed to extract non-empty SHA-1 or SHA-256 fingerprint from certificate output.");
              process.exit(1);
            }
            const summary = [
              "### Android Release APK Signing Summary",
              "",
              "| 項目 | 値 |",
              "| :--- | :--- |",
              "| `applicationId` | `com.highsoar.exlibris` |",
              "| `buildType` | `release` |",
              `| \`versionName\` | \`${process.env.VERSION_NAME}\` |`,
              `| \`versionCode\` | \`${process.env.VERSION_CODE}\` |`,
              "| 署名方式 | `Fixed Keystore (GitHub Secrets)` |",
              `| 検証ツール | \`${process.env.VERIFY_TOOL}\` |`,
              `| \`SHA-1\` | \`${sha1}\` |`,
              `| \`SHA-256\` | \`${sha256}\` |`,
              "",
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          '

      - name: Create Git Tag and GitHub Release with APK
        if: steps.check_existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          TAG: ${{ steps.meta.outputs.tag }}
          MAJOR_MINOR: ${{ steps.meta.outputs.major_minor }}
          PATCH: ${{ steps.meta.outputs.patch }}
          REPORT_PATH: ${{ steps.meta.outputs.report_path }}
        run: |
          if [ "${PATCH}" = "0" ] && [ -n "${REPORT_PATH}" ]; then
            NOTES_HEADER="Milestone \`v${MAJOR_MINOR}\` 完了リリース（品質分析レポート: https://github.com/${REPO}/blob/${TAG}/${REPORT_PATH} ）"
          elif [ "${PATCH}" != "0" ]; then
            NOTES_HEADER="Hotfix リリース（${TAG}）"
          else
            NOTES_HEADER="リリース ${TAG}"
          fi

          gh release create "${TAG}" "ex-libris-${TAG}.apk" \
            --repo "${REPO}" \
            --target "${TARGET_SHA}" \
            --title "${TAG}" \
            --notes "${NOTES_HEADER}" \
            --generate-notes
