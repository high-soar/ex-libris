name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint-and-unit:
    name: Static Checks & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify OKF documentation format
        run: npm run lint:okf

      - name: Prettier format check
        run: npm run format:check

      - name: ESLint static analysis
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Vitest unit tests & coverage (100% threshold)
        run: npm run test:coverage

  vrt-and-e2e:
    name: VRT, WebGL2 E2E & Build (Debian 12 Parity)
    runs-on: ubuntu-latest
    container:
      image: node:24-bookworm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: /root/.npm
          key: npm-bookworm-${{ hashFiles('package-lock.json') }}

      - name: Configure APT retries and install Japanese fonts
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/99-retries
          echo 'Acquire::http::Timeout "60";' >> /etc/apt/apt.conf.d/99-retries
          echo 'Acquire::https::Timeout "60";' >> /etc/apt/apt.conf.d/99-retries
          apt-get update --fix-missing || apt-get update
          apt-get install -y --no-install-recommends \
            fonts-dejavu-core \
            fonts-noto-cjk \
            fontconfig
          fc-cache -fv

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: /root/.cache/ms-playwright
          key: playwright-chromium-bookworm-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium with system dependencies
        run: npx playwright install --with-deps chromium

      - name: Storybook VRT (1280px / 375px)
        run: npm run test:vrt

      - name: Production build
        run: npm run build

      - name: Playwright integration tests (IT)
        run: npx playwright test -c playwright.it.config.ts

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/

  android-compile:
    name: Android Java Compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-cleanup: never
          gradle-home-cache-strict-match: true

      - name: Compile & Assemble Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

  quality-gate:
    name: Lint, Test & Quality Gates
    needs: [lint-and-unit, vrt-and-e2e, android-compile]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Verify all quality gates passed
        env:
          LINT_UNIT_RESULT: ${{ needs.lint-and-unit.result }}
          VRT_E2E_RESULT: ${{ needs.vrt-and-e2e.result }}
          ANDROID_COMPILE_RESULT: ${{ needs.android-compile.result }}
        run: |
          if [ "${LINT_UNIT_RESULT}" != "success" ] || [ "${VRT_E2E_RESULT}" != "success" ] || [ "${ANDROID_COMPILE_RESULT}" != "success" ]; then
            echo "Quality Gate Failed: lint-and-unit=${LINT_UNIT_RESULT}, vrt-and-e2e=${VRT_E2E_RESULT}, android-compile=${ANDROID_COMPILE_RESULT}"
            exit 1
          fi
          echo "All quality gate checks passed successfully."
